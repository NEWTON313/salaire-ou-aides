<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable · salaire-ou-aides.fr</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--paper:#f3f5f9;--surface:#fff;--ink:#161e36;--muted:#56617c;--line:#d8deea;--work:#2547a6;--aid:#c27510;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0e1321;--surface:#161d30;--ink:#e6eaf4;--muted:#98a3bd;--line:#29324d;--work:#86a2ff;--aid:#eaa845;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;padding:24px 16px}
main{max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.gauges{display:flex;align-items:flex-end;gap:10px;height:90px}
.gauges i{display:block;width:30px;border-radius:6px}
.gauges i:first-child{height:40%;background:var(--aid)}
.gauges i:last-child{height:100%;background:var(--work);opacity:.25}
h1{font-family:"Archivo","Arial Narrow",system-ui,sans-serif;font-stretch:85%;font-size:2.4rem;margin:6px 0 0;line-height:1.1}
p{color:var(--muted);margin:0;line-height:1.5}
a.cta{margin-top:8px;display:inline-block;padding:10px 20px;border-radius:8px;background:var(--work);color:var(--surface);font-weight:700;text-decoration:none}
a.cta:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
  <div class="gauges" aria-hidden="true"><i></i><i></i></div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être incomplet ou la page a été déplacée. Le simulateur, lui, vous attend sur la page d'accueil.</p>
  <a class="cta" href="/">Revenir au simulateur</a>
</main>
</body>
</html>
